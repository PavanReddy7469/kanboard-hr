; PHP limits for this application.
;
; The server was running PHP's shipped defaults, which cap an upload at 2 MB.
; That is what made "upload of documents not working" look like a broken
; feature: a drawing or a scanned report is tens of megabytes, the request
; was refused before any of our code ran, and the page came back with
; nothing to say about it.
;
; PHP-FPM reads this file because upload_max_filesize, post_max_size and the
; rest below are PHP_INI_PERDIR settings. php_value lines in .htaccess would
; NOT work here - those need mod_php, and an unrecognised php_value directive
; makes Apache return 500 for every page.
;
; Two things outside PHP can still refuse a large upload before PHP sees it,
; and neither is set from here:
;
;   Apache   LimitRequestBody   - 0 means unlimited, which is the default
;   nginx    client_max_body_size - defaults to 1 MB, so if anything proxies
;                                   this site it must be raised too
;
; Changes here are picked up within user_ini.cache_ttl, 5 minutes by default,
; or immediately on `systemctl reload php8.5-fpm`.

; The ceiling anyone can attach: PDFs, Word documents, text, images,
; drawings, archives.
upload_max_filesize = 100M

; Must be LARGER than upload_max_filesize. A form carries the file plus its
; other fields plus the multipart boundaries; when post_max_size is the
; smaller of the two, PHP discards the entire request body and the upload
; fails silently with no error anywhere. ops/diagnose.php checks for exactly
; this.
post_max_size = 110M

; At least post_max_size, or a large upload dies part-way through with an
; exhausted-memory fatal rather than a message.
memory_limit = 256M

; 100 MB over a slow office line takes minutes. The defaults of 30 seconds
; cut the connection halfway and leave a half-written file.
max_execution_time = 300
max_input_time = 300

; Several attachments in one go.
max_file_uploads = 20
