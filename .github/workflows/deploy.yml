name: Deploy Kanboard-HR

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -uo pipefail
            APP=/var/www/kanboard-hr

            # Every stage announces itself and is written to a file the site
            # serves, so a failed deploy can be diagnosed from outside without
            # anyone needing to be signed in to read Actions logs.
            STATUS="$APP/deploy-status.txt"
            stage() { echo "== $1"; echo "$(date -u +%FT%TZ) $1" >> "$STATUS" 2>/dev/null || true; }
            die()   { echo "DEPLOY FAILED at: $1"; echo "$(date -u +%FT%TZ) FAILED: $1" >> "$STATUS" 2>/dev/null || true; exit 1; }

            stage "cd $APP"
            cd "$APP" || die "cd $APP (directory missing?)"
            : > "$STATUS" 2>/dev/null || echo "(cannot write $STATUS - continuing)"
            stage "start ${{ github.sha }}"

            # git refuses a repository owned by another user. Declare it safe
            # BEFORE any git command, and without sudo, so this cannot be the
            # thing that stops the deploy.
            git config --global --add safe.directory "$APP" 2>/dev/null || true

            # Passwordless sudo may or may not exist for this account. Find out
            # once, and degrade to no-sudo rather than dying - shipping the code
            # matters more than re-applying permissions that are already right.
            if sudo -n true 2>/dev/null; then SUDO="sudo"; stage "sudo: available";
            else SUDO=""; stage "sudo: NOT available (skipping ownership/permission steps)"; fi

            if [ -n "$SUDO" ]; then
              $SUDO chown -R "$(id -un):$(id -gn)" "$APP/.git" || stage "warn: could not chown .git"
            fi

            stage "git rev-parse (before)"
            BEFORE=$(git rev-parse HEAD 2>&1) || die "git rev-parse: $BEFORE"
            stage "before=$BEFORE"

            stage "git fetch"
            FETCH=$(git fetch origin master 2>&1) || die "git fetch: $FETCH"

            stage "git reset"
            RESET=$(git reset --hard origin/master 2>&1) || die "git reset: $RESET"

            git clean -fd || stage "warn: git clean failed"

            AFTER=$(git rev-parse HEAD)
            stage "after=$AFTER"
            [ "$AFTER" = "${{ github.sha }}" ] || die "checkout is $AFTER, expected ${{ github.sha }}"

            sed -i 's|# RewriteBase /|RewriteBase /kanboard/|g' .htaccess || stage "warn: sed on .htaccess failed"

            if [ -n "$SUDO" ]; then
              stage "permissions"
              $SUDO chown -R www-data:www-data "$APP"                                   || stage "warn: chown app"
              $SUDO chown -R "$(id -un):$(id -gn)" "$APP/.git"                          || stage "warn: chown .git"
              $SUDO find "$APP" -path "$APP/.git" -prune -o -type f -exec chmod 644 {} \; || stage "warn: chmod files"
              $SUDO find "$APP" -path "$APP/.git" -prune -o -type d -exec chmod 755 {} \; || stage "warn: chmod dirs"
              $SUDO chmod -R 775 "$APP/data"                                            || stage "warn: chmod data"

              stage "restart php-fpm / apache"
              V=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;' 2>/dev/null || echo "")
              [ -n "$V" ] && ($SUDO systemctl restart "php$V-fpm" || stage "warn: php$V-fpm restart")
              $SUDO systemctl reload apache2 || stage "warn: apache reload"
            else
              stage "skipped permissions and service restart (no sudo)"
            fi

            stage "OK deployed $AFTER"
            echo "deployed $AFTER"
